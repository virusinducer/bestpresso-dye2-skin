name: Sync skin release

# The skin is built by virusinducer/bestpresso-dye2-plugin and published on its `dist` branch. Decaid installs
# skins from a repo's latest release, so this repo republishes each new build as a release.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the built skin
        uses: actions/checkout@v4
        with:
          repository: virusinducer/bestpresso-dye2-plugin
          ref: dist
          path: skin

      - name: Read the skin version
        id: skin
        run: |
          version=$(jq -r .version skin/skin-manifest.json)
          id=$(jq -r .id skin/skin-manifest.json)
          [ "$id" = "bestpresso-dye" ] || { echo "unexpected skin id: $id"; exit 1; }
          [ -n "$version" ] && [ "$version" != "null" ] || { echo "no version in skin-manifest.json"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish a release if this build is new or changed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.skin.outputs.version }}
        run: |
          tag="v$VERSION"
          sha=$(git -C skin rev-parse HEAD)
          if gh release view "$tag" --json body --jq .body 2>/dev/null | grep -q "build $sha"; then
            echo "$tag already released from this build"
            exit 0
          fi
          # Same version, new build (our own patch changed): replace the release.
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          rm -rf skin/.git
          (cd skin && zip -qr "../bestpresso-dye-$tag.zip" .)
          gh release create "$tag" "bestpresso-dye-$tag.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "Bestpresso $VERSION by Hendri (xinghendri/bestpresso) with a DYE2 button, built by virusinducer/bestpresso-dye2-plugin (build $sha). Install the matching plugin from that repo. Changes: https://github.com/virusinducer/bestpresso-dye2-plugin/blob/main/CHANGELOG.md"
